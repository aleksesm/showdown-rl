[project]
name = "showdown-rl"
version = "0.0.1"
description = "Reinforcement learning agent for Gen 9 Random Battles on Pokémon Showdown."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "poke-env>=0.8.0",
]

[project.optional-dependencies]
# Installed in Phase 3 when we start writing the PPO trainer.
rl = [
    "torch>=2.4",
    "numpy>=1.26",
    "tensorboard>=2.16",
]
# Learning curves + eval plots.
plot = [
    "matplotlib>=3.8",
]
# Installed when we need exploratory analysis.
analysis = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "jupyter>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showdown_rl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # let formatter handle line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
